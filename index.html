<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DD4A2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>西语学习 · 每天十分钟</title>
<style>
/* ============================================================
   西语学习 · 设计令牌（暖色 / 西班牙风：奶白底 + 西班牙红 + 暖金）
   ============================================================ */
:root{
  --brand:#DD4A2F; --brand-d:#B8351E; --brand-bg:#FBE7E1;
  --gold:#E0A23C; --gold-d:#B97C18; --gold-bg:#FBEFD9;
  --ok:#4F8A5B; --ok-bg:#E7F2EA;
  --warn:#D98A2B; --warn-bg:#FBEFDD;
  --ink:#2A2420; --sub:#6E655C; --hint:#A0978D;
  --bg:#FBF5EC; --card:#FFFFFF; --line:#EFE3D4; --soft:#F5ECDF;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px; --r-pill:999px;
  --tap:46px;
  --t-fast:130ms; --t:240ms; --t-slow:420ms;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sh-1:0 1px 2px rgba(60,40,20,.05),0 4px 14px rgba(60,40,20,.05);
  --sh-2:0 12px 40px rgba(60,40,20,.18);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans",sans-serif;
  color:var(--ink);line-height:1.65;
  -webkit-text-size-adjust:100%;
  background:
    radial-gradient(1100px 420px at 50% -12%, #FCEFE0 0%, rgba(252,239,224,0) 60%),
    var(--bg);
  background-attachment:fixed;
}
button{font-family:inherit}
::selection{background:var(--brand-bg)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* ======================= 顶栏 ======================= */
.appbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid var(--line)}
.appbar-inner{max-width:900px;margin:0 auto;padding:11px var(--s4);display:flex;align-items:center;gap:var(--s3)}
.brandmark{
  flex:0 0 auto;width:34px;height:34px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;
  font-weight:800;font-size:19px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--gold));
  box-shadow:0 4px 12px rgba(221,74,47,.35);
}
.brandtext{display:flex;flex-direction:column;line-height:1.15;margin-left:-4px}
.brand{font-weight:800;font-size:16px;color:var(--ink);letter-spacing:.2px}
.tagline{font-size:10.5px;color:var(--hint);font-weight:500;letter-spacing:.3px}
.topnav{display:flex;gap:var(--s1);margin-left:var(--s4);overflow-x:auto;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.navtab{
  background:none;border:none;padding:8px 14px;border-radius:var(--r-pill);
  font-size:13px;color:var(--sub);cursor:pointer;white-space:nowrap;min-height:36px;
  transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease);
}
.navtab:hover{background:var(--soft)}
.navtab.on{background:var(--brand-bg);color:var(--brand-d);font-weight:700}
.appbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.progress-chip{
  display:inline-flex;gap:7px;align-items:center;font-size:12px;color:var(--sub);
  background:#fff;border:1px solid var(--line);box-shadow:var(--sh-1);border-radius:var(--r-pill);padding:5px 12px;white-space:nowrap;
}
.progress-chip b{color:var(--brand);font-size:13px}

/* ======================= 设置面板 ======================= */
.settings{max-width:900px;margin:0 auto;padding:0 var(--s4)}
.panel{margin-top:var(--s2);display:flex;gap:var(--s2);flex-wrap:wrap;justify-content:flex-end}
.panel[hidden]{display:none}   /* 关键：否则 display:flex 会盖掉 hidden，面板永远关不上 */
.set-row{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin:12px 0}
.set-label{font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap}
.set-row .input{flex:1;min-width:140px}
.sel{font:inherit;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;background:#fff;color:var(--ink);min-height:40px}
.set-hint{margin:8px 0 0;line-height:1.7;color:var(--sub)}
.set-hr{border:none;border-top:1px solid var(--line);margin:16px 0}

/* ======================= 主体 ======================= */
.view{max-width:900px;margin:0 auto;padding:var(--s4) var(--s4) var(--s6)}

/* ======================= 底部 Tab Bar（手机） ======================= */
.tabbar{display:none}

/* ======================= 卡片与排版 ======================= */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);
  padding:var(--s4);margin-bottom:var(--s3);box-shadow:var(--sh-1);
}
.card.center{text-align:center}
.mod-head{display:flex;align-items:flex-start;gap:var(--s3);flex-wrap:wrap;margin:var(--s2) 0 var(--s4)}
.mod-title{font-size:21px;font-weight:800;letter-spacing:.2px}
.mod-sub{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.6}
.mod-head .btn{margin-left:auto}
.center{text-align:center}
.hint{font-size:12.5px;color:var(--hint)}
.hint.center{text-align:center}
.brand{color:var(--brand)}
.ipa{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--sub)}
.dots{letter-spacing:2px;color:var(--gold-d);font-size:12px;font-weight:600}

/* ======================= 按钮 ======================= */
.btn{
  background:linear-gradient(180deg,var(--brand),#CE3F26);
  color:#fff;border:1px solid transparent;
  padding:0 20px;min-height:var(--tap);border-radius:14px;
  font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 12px rgba(221,74,47,.28);
  transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),filter var(--t-fast) var(--ease);
}
.btn:hover{filter:brightness(1.04);box-shadow:0 6px 18px rgba(221,74,47,.34)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.soft{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.soft:hover{background:var(--soft);filter:none}
.btn.ghost{background:var(--brand-bg);color:var(--brand-d);border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:#f9d9cf}
.btn.danger{color:var(--brand);border-color:var(--brand);background:#fff;box-shadow:none}
.btn-sm{min-height:36px;padding:0 14px;font-size:13px;border-radius:12px}
.link{background:none;border:none;color:var(--brand);cursor:pointer;font-size:inherit;text-decoration:underline;padding:0}

/* ======================= 行布局 ======================= */
.row-start,.row-end,.row-between,.row-center{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.row-end{justify-content:flex-end}
.row-between{justify-content:space-between}
.row-center{justify-content:center}

/* ======================= Tabs ======================= */
.tabs{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
.tab{background:#fff;border:1px solid var(--line);padding:8px 16px;border-radius:var(--r-pill);font-size:13px;cursor:pointer;min-height:36px;transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.tab:hover{border-color:#e3d4c2}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ======================= 音标模块 ======================= */
.pho-card{padding:var(--s4)}
.pho-sec{font-size:14px;margin-bottom:var(--s2);color:var(--brand-d);font-weight:700}
.pho-item{display:flex;gap:var(--s3);align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
.pho-item:last-child{border-bottom:none}
.pho-sym{font-weight:700;min-width:92px;font-size:14px}
.pho-meta{flex:1;font-size:13.5px}
.quiz-card b{font-size:14px}
.quiz-item{padding:11px 0;border-bottom:1px dashed var(--line)}
.quiz-item:last-child{border-bottom:none}
.mini{background:#fff;border:1px solid var(--line);border-radius:var(--r-pill);padding:8px 16px;font-size:13px;cursor:pointer;min-height:36px;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
.mini:hover{background:var(--soft)}
.mini.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.mini.no{background:var(--brand-bg);border-color:var(--brand);color:var(--brand)}
.mini.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(221,74,47,.3)}
.mini.on:hover{filter:brightness(1.05)}
.pair{display:flex;gap:var(--s2)}

/* ======================= 单词模块 ======================= */
.word-card{padding:var(--s5) var(--s4)}
.wc-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--hint)}
.wc-word{font-size:34px;font-weight:800;margin-top:var(--s2);color:var(--ink);letter-spacing:.3px}
.wc-zh{min-height:32px;margin-top:var(--s2)}
.wc-zh .zh{font-size:17px;color:var(--brand-d);font-weight:600}
.wc-meta{font-size:12.5px;color:var(--sub);margin-top:2px}
.wc-ex{margin-top:var(--s3);background:var(--soft);border-radius:var(--r-md);padding:10px var(--s3);font-size:13.5px}
.tip{margin-top:var(--s3);background:var(--gold-bg);border:1px solid #f1dcb3;border-radius:var(--r-md);padding:9px var(--s3);font-size:12.5px;color:#8a5a12}
.action-bar{display:flex;gap:var(--s2);margin-top:var(--s4)}
.ab{flex:1;min-height:var(--tap);border:1px solid var(--line);background:#fff;border-radius:var(--r-md);font-size:13.5px;cursor:pointer;transition:background var(--t-fast) var(--ease)}
.ab:hover{background:var(--soft)}
.ab:disabled{opacity:.5;cursor:not-allowed}
.ab.rec-on{background:var(--brand-bg);border-color:var(--brand);color:var(--brand-d)}

/* ======================= 选项 / 看图 ======================= */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s3)}
.opt{padding:15px var(--s3);border:1px solid var(--line);background:#fff;border-radius:var(--r-md);font-size:15px;cursor:pointer;text-align:left;min-height:var(--tap);transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.opt:hover:not(:disabled){background:var(--soft);border-color:#e3d4c2}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.no{background:var(--brand-bg);border-color:var(--brand);color:var(--brand)}
.opt:disabled{cursor:default}
.pic-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);margin-top:var(--s3)}
.pic-item{padding:var(--s3);border:1px solid var(--line);background:#fff;border-radius:var(--r-md);cursor:pointer;min-height:76px;display:flex;align-items:center;justify-content:center}
.pic-item .em{font-size:38px;line-height:1}
.pic-item.ok{background:var(--ok-bg);border-color:var(--ok)}
.pic-item.no{background:var(--brand-bg);border-color:var(--brand)}
.pic-item:disabled{cursor:default}
.emoji{font-size:74px;line-height:1.2;margin:var(--s2) 0;text-align:center}
.big-word{font-size:26px;font-weight:700;margin:var(--s2) 0;text-align:center}
.big-word.sm{font-size:19px;font-weight:500}
.pc-top{display:flex;justify-content:space-between;align-items:center}

/* ======================= 输入 ======================= */
.input{width:100%;min-height:var(--tap);padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--r-md);font-size:16px;margin:var(--s2) 0;background:#fff;color:var(--ink);transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}

/* ======================= 阅读 ======================= */
.reader{font-size:17px;line-height:2.05}
.sent{margin:8px 0;padding:4px 6px;border-radius:var(--r-sm)}
.sent:hover{background:var(--soft)}
.w{cursor:pointer;border-bottom:1px dotted #d8cab6}
.w.unknown{border-bottom:1px dashed var(--brand)}
.w:hover{background:#fbeed6;border-radius:4px}
.popup{position:absolute;z-index:60;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:var(--s4);width:250px}
.lk-word{font-weight:700;font-size:17px;color:var(--ink)}
.lk-zh{color:var(--brand-d);margin:2px 0;font-weight:600}
.backdrop{position:fixed;inset:0;background:rgba(40,30,20,.4);z-index:50;animation:fade .2s var(--ease)}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;
  border-radius:var(--r-xl) var(--r-xl) 0 0;padding:var(--s5) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom));
  box-shadow:var(--sh-2);animation:slideUp var(--t) var(--ease);
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
.sheet::before{content:"";display:block;width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto var(--s3)}

/* ======================= 反馈 / 进度 / 结算 ======================= */
.feedback{margin-top:var(--s3);font-weight:700;min-height:22px;font-size:14px}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--brand)}
.bar{height:12px;background:var(--soft);border-radius:var(--r-pill);overflow:hidden;margin:var(--s4) 0}
.bar.slim{height:6px;margin:var(--s2) 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold));border-radius:var(--r-pill);transition:width var(--t-slow) var(--ease)}
.combo{color:var(--gold-d);font-weight:700;font-size:13px}
.as-top{display:flex;justify-content:space-between;align-items:center}
.summary{text-align:center;padding:var(--s6) var(--s4)}
.bignum{font-size:46px;font-weight:800;color:var(--brand);line-height:1.1;letter-spacing:.5px}
.encourage{font-size:15px;margin:var(--s2) 0;color:var(--ink)}
.milestone{background:linear-gradient(135deg,var(--gold),var(--brand));color:#fff;border-radius:var(--r-md);padding:11px var(--s3);margin:var(--s3) 0;font-weight:700}

/* ======================= 手机：底部 Tab Bar + 适配 ======================= */
@media (max-width:899px){
  .topnav{display:none}
  .appbar-inner{padding:9px var(--s3)}
  .tagline{display:none}
  .view{padding:var(--s3) var(--s3) calc(84px + env(safe-area-inset-bottom))}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tabitem{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 2px;min-height:52px;cursor:pointer;color:var(--hint);font-size:11px;border-radius:var(--r-sm);
  }
  .tabitem i{font-style:normal;font-size:15px;font-weight:600;line-height:1}
  .tabitem.on{color:var(--brand)}
  .opts{grid-template-columns:1fr}
  .pic-grid{grid-template-columns:repeat(2,1fr)}
  .emoji{font-size:64px}
  .wc-word{font-size:30px}
  .progress-chip span:last-child{display:none}
}
@media (max-width:400px){
  .action-bar{flex-wrap:wrap}
  .ab{flex:1 0 44%}
  .brand{font-size:15px}
}

/* ======================= 分段控件 / 拼写默写 ======================= */
.seg{display:flex;gap:4px;max-width:100%;overflow-x:auto;background:var(--soft);border-radius:var(--r-pill);padding:4px;margin-bottom:var(--s3);scrollbar-width:none;box-shadow:inset 0 0 0 1px var(--line)}
.seg::-webkit-scrollbar{display:none}
.seg button{border:none;background:none;padding:8px 16px;border-radius:var(--r-pill);font-size:13px;color:var(--sub);cursor:pointer;min-height:36px;white-space:nowrap;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.seg button.on{background:#fff;color:var(--brand-d);font-weight:700;box-shadow:var(--sh-1)}

.type-card{padding:var(--s5) var(--s4)}
.type-dir{display:flex;gap:var(--s2);margin:var(--s3) 0}
.type-dir .mini.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(221,74,47,.3)}
.type-prompt{font-size:24px;font-weight:700;margin:var(--s2) 0 var(--s3);text-align:center;color:var(--ink)}

/* 跟写：大号目标词（照着打） */
.big-es{font-size:42px;font-weight:800;text-align:center;margin:6px 0;letter-spacing:.5px;word-break:break-word;line-height:1.15;color:var(--ink)}

/* 听写：整块圆形发声按钮 */
.type-audio{
  font-size:40px;background:linear-gradient(135deg,var(--brand),var(--gold));color:#fff;border:none;border-radius:var(--r-pill);
  width:88px;height:88px;margin:6px auto;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 8px 22px rgba(221,74,47,.32);
  transition:transform var(--t-fast) var(--ease),filter var(--t-fast) var(--ease);
}
.type-audio:hover{filter:brightness(1.05)}
.type-audio:active{transform:scale(.96)}

/* 实时逐字校验条：cm 对 / cw 错 / ca 重音 / cd 未输入 */
.type-fb{
  font-family:ui-monospace,Consolas,monospace;font-size:22px;text-align:center;
  min-height:30px;margin:6px 0;letter-spacing:2px;word-break:break-all;line-height:1.4;
}
.type-fb .cm{color:var(--ok)}
.type-fb .cw{color:var(--brand);text-decoration:underline;text-underline-offset:3px}
.type-fb .ca{color:var(--warn);text-decoration:underline wavy;text-underline-offset:3px}
.type-fb .cd{color:var(--hint);opacity:.45}

/* 桌面快捷键提示 */
.kb-hint{font-size:12px;color:var(--hint);text-align:center;margin-top:10px;line-height:1.9}
.kbd{font-family:ui-monospace,Consolas,monospace;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;color:var(--sub)}

.type-input{display:flex;gap:var(--s2);align-items:center}
.type-input .input{flex:1;margin:var(--s2) 0}
.type-input .btn{padding:0 16px}

@media (max-width:899px){
  .type-prompt{font-size:22px}
  .type-input .btn{padding:0 12px}
  .big-es{font-size:34px}
  .type-audio{width:78px;height:78px;font-size:36px}
  .type-fb{font-size:20px;letter-spacing:1px}
}

/* ======================= 等级徽标（A1–C2 暖色配色） ======================= */
.lvl{display:inline-block;padding:2px 9px;border-radius:var(--r-sm);font-size:11.5px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.lvl-A1{background:#EAF3DE;color:#3B6D11}
.lvl-A2{background:#E1F5EE;color:#0F6E56}
.lvl-B1{background:#E6F1FB;color:#185FA5}
.lvl-B2{background:#FAEEDA;color:#854F0B}
.lvl-C1{background:#FAECE7;color:#993C1D}
.lvl-C2{background:#EEEDFE;color:#534AB7}

/* ======================= 词书库 ======================= */
.book-tip{font-size:13px;color:var(--sub);margin-bottom:var(--s3)}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--s3)}
.book-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh-1);transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease),border-color var(--t) var(--ease)}
.book-card:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:#ecdcc7}
.bk-top{display:flex;justify-content:space-between;align-items:center}
.bk-name{font-size:15px;font-weight:700}
.bk-desc{font-size:12.5px;color:var(--sub);line-height:1.55;flex:1}
.bk-actions{display:flex;gap:var(--s2);margin-top:4px}
.bk-actions .btn{flex:1}
.book-head{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s3) var(--s4);margin-bottom:var(--s3);box-shadow:var(--sh-1)}
.book-head-info{display:flex;align-items:center;gap:8px;flex:1}
.book-head-info b{font-size:15px}
